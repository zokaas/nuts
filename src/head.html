<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9661f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pallakselle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Matka Pallakselle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column read top to bottom — status, today, this week, the route profile, what is coming. */
:root{
  --bg:#eef1ef; --surface:#ffffff; --ink:#16211f; --muted:#4c5956; --line:#d5dcd9;
  --accent:#d9661f;   /* lakka: cloudberry orange */
  --fell:#2e4a52;     /* tunturi: slate blue-green */
  --ok:#2f7d55; --warn:#a87700; --crit:#b8322a;
  --ok-bg:#e4f1ea; --warn-bg:#f8eed2; --crit-bg:#f7e1df; --info-bg:#e6edf0;
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1716; --surface:#172221; --ink:#e7eeec; --muted:#a9b7b3; --line:#2a3836;
    --accent:#f08a43; --fell:#8fb3bb;
    --ok:#5fbf8a; --warn:#e0b440; --crit:#f07068;
    --ok-bg:#16301f; --warn-bg:#352b10; --crit-bg:#3a1a18; --info-bg:#1b2a2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172221; --ink:#e7eeec; --muted:#a9b7b3; --line:#2a3836;
  --accent:#f08a43; --fell:#8fb3bb;
  --ok:#5fbf8a; --warn:#e0b440; --crit:#f07068;
  --ok-bg:#16301f; --warn-bg:#352b10; --crit-bg:#3a1a18; --info-bg:#1b2a2e;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;}
.wrap{max-width:620px; margin:0 auto; padding:20px 16px 64px; display:flex; flex-direction:column; gap:18px;}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance;}
.num{font-variant-numeric:tabular-nums;}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, textarea:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* Masthead */
.mast{display:flex; flex-direction:column; gap:10px}
.route{font-family:var(--display); font-stretch:125%; font-weight:900; font-size:clamp(30px,8.5vw,46px); line-height:.95; letter-spacing:-.01em; text-transform:uppercase;}
.route .arrow{color:var(--accent); font-stretch:62%;}
.route small{display:block; font-size:.36em; font-stretch:100%; font-weight:600; letter-spacing:.06em; color:var(--muted); margin-top:8px}
.count{display:flex; gap:8px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:baseline; gap:6px; padding:6px 10px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:14px}
.chip b{font-family:var(--display); font-stretch:110%; font-size:16px}

/* Status */
.status{border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; border:1px solid var(--line); background:var(--surface)}
.status-head{display:flex; align-items:center; gap:10px}
.dot{width:12px; height:12px; border-radius:50%; flex:none}
.status-head h2{font-size:18px; font-stretch:110%}
.st-ok .dot{background:var(--ok)} .st-warn .dot{background:var(--warn)} .st-crit .dot{background:var(--crit)}
.warns{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none}
.warn{border-left:4px solid; border-radius:6px; padding:8px 10px; font-size:15px}
.warn b{display:block}
.warn span{color:var(--muted)}
.w-crit{border-color:var(--crit); background:var(--crit-bg)} .w-warn{border-color:var(--warn); background:var(--warn-bg)} .w-info{border-color:var(--fell); background:var(--info-bg)}
.note{font-size:14px; color:var(--muted)}

/* Today card */
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px}
.eyebrow{font-family:var(--display); font-stretch:115%; font-weight:700; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.today-title{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.today-title h2{font-size:26px; font-stretch:112%; font-weight:800}
.type{display:inline-block; padding:3px 9px; border-radius:6px; font-size:13px; font-weight:700; background:var(--info-bg); color:var(--ink)}
.t-run{background:#dbe8f5; color:#173a5c} .t-long{background:#d6ece8; color:#124a40} .t-test{background:#f7dcd3; color:#7a2410} .t-race{background:var(--accent); color:#fff}
.t-bike{background:#f6ecc9; color:#5a4400} .t-gym{background:#f3dcec; color:#5e1f4a} .t-hike{background:#dcefd7; color:#204d17} .t-rest{background:transparent; color:var(--muted); border:1px dashed var(--line)}
:root[data-theme="dark"] .t-run{background:#1d3550;color:#cfe2f7} :root[data-theme="dark"] .t-long{background:#183f39;color:#c7ece5} :root[data-theme="dark"] .t-test{background:#4a2418;color:#f7d3c6} :root[data-theme="dark"] .t-bike{background:#3d3410;color:#f3e3a6} :root[data-theme="dark"] .t-gym{background:#3e1c33;color:#f1cfe6} :root[data-theme="dark"] .t-hike{background:#1f3a1b;color:#cfeac8}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .t-run{background:#1d3550;color:#cfe2f7} :root:not([data-theme="light"]) .t-long{background:#183f39;color:#c7ece5} :root:not([data-theme="light"]) .t-test{background:#4a2418;color:#f7d3c6} :root:not([data-theme="light"]) .t-bike{background:#3d3410;color:#f3e3a6} :root:not([data-theme="light"]) .t-gym{background:#3e1c33;color:#f1cfe6} :root:not([data-theme="light"]) .t-hike{background:#1f3a1b;color:#cfeac8} }
.target{font-size:17px; margin:0}
.tip{font-size:14px; color:var(--muted); margin:0}
.state{font-weight:700}
.state.done{color:var(--ok)} .state.skip{color:var(--crit)}
.row{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:11px 16px; font-weight:700}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{outline:2px solid var(--ink)}
.btn:disabled{opacity:.5; cursor:default}

/* Week strip */
.weekhead{display:flex; align-items:center; justify-content:space-between; gap:8px}
.weekhead h2{font-size:20px; font-stretch:112%}
.navbtns{display:flex; gap:6px}
.navbtns button{border:1px solid var(--line); background:var(--surface); border-radius:8px; width:38px; height:34px}
.kmbar{display:flex; flex-direction:column; gap:6px}
.kmbar .track{height:10px; background:var(--line); border-radius:6px; overflow:hidden}
.kmbar .fill{height:100%; background:var(--accent)}
.kmbar .lbl{display:flex; justify-content:space-between; font-size:14px; color:var(--muted)}
.days{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line)}
.day{display:grid; grid-template-columns:52px 1fr 26px; gap:10px; align-items:center; padding:10px 2px; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; width:100%}
.day.is-today{background:var(--info-bg); border-radius:8px}
.day .d{font-family:var(--display); font-stretch:105%; font-weight:700; font-size:14px; line-height:1.15}
.day .d small{display:block; font-weight:500; color:var(--muted); font-family:var(--body); font-size:12px}
.day .what{display:flex; flex-direction:column; align-items:flex-start; gap:3px; min-width:0}
.day .what .t{max-width:100%}
.day .what .t{font-size:14px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mark{width:24px; height:24px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:13px; font-weight:800}
.mark.done{background:var(--ok); border-color:var(--ok); color:#fff}
.mark.skip{background:var(--crit-bg); border-color:var(--crit); color:var(--crit)}
.mark.pain{box-shadow:0 0 0 3px var(--warn-bg)}

/* Profile */
.profile svg{width:100%; height:auto; display:block}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px}

/* Upcoming */
.up{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.up li{display:grid; grid-template-columns:78px 1fr; gap:10px; font-size:15px}
.up time{font-family:var(--display); font-stretch:105%; font-weight:700}

/* Editor sheet */
.sheet-bg{position:fixed; inset:0; background:rgba(10,18,17,.45); display:none; align-items:flex-end; justify-content:center; z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface); width:100%; max-width:620px; border-radius:16px 16px 0 0; padding:18px 16px 24px; display:flex; flex-direction:column; gap:14px; max-height:92%; overflow:auto}
.sheet h3{font-size:20px; font-stretch:110%}
label{font-weight:700; font-size:14px}
.field{display:flex; flex-direction:column; gap:6px}
input[type=number], input[type=text], textarea{font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%}
textarea{min-height:64px; resize:vertical}
.feel{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.feel button{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 0; font-weight:700; display:flex; flex-direction:column; align-items:center; font-size:15px}
.feel button small{font-weight:400; font-size:11px; color:var(--muted)}
.feel button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.feel button[aria-pressed="true"] small{color:#fff}
.err{color:var(--crit); font-size:14px; margin:0}
footer{font-size:13px; color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .fill{transition:width .4s ease} }

/* v2 */
.tabs{position:sticky; top:0; z-index:5; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
.tabs a{text-align:center; padding:9px 0; border-radius:9px; color:var(--muted); text-decoration:none; font-family:var(--display); font-stretch:110%; font-weight:700; font-size:15px}
.tabs a[aria-current="page"]{background:var(--ink); color:var(--bg)}
.view{display:flex; flex-direction:column; gap:18px}
.view[hidden]{display:none}
.chip.lvl b{font-stretch:100%}
.status-head .note{margin:0}
.sess{display:flex; flex-direction:column; gap:10px}
.sess.extra{border-top:1px dashed var(--line); padding-top:12px}
.cheer{font-style:italic}
.trail svg{width:100%; height:auto; display:block}
#deer{transition:transform .8s ease}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:2px}
.tile span{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-family:var(--display); font-weight:700}
.tile b{font-family:var(--display); font-stretch:115%; font-size:22px}
.filters{display:flex; gap:6px; flex-wrap:wrap}
.filters button{border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:6px 12px; font-size:14px}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
input[type=search], select{font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 12px}
input[type=search]{flex:1; min-width:160px}
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:640px}
th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; white-space:nowrap}
th{font-family:var(--display); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); background:var(--bg)}
td.nt{white-space:normal; min-width:180px; color:var(--muted)}
.r{text-align:right}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--info-bg)}
.btn.small{padding:7px 12px; font-size:14px}
.levelcard{flex-direction:row; align-items:center; gap:16px}
.lvlbig{font-size:56px; line-height:1}
.lvlinfo{flex:1; display:flex; flex-direction:column; gap:8px}
.lvlinfo h2{font-size:28px; font-stretch:120%; font-weight:900}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
.badge{border:1px dashed var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:4px; opacity:.55; filter:grayscale(1)}
.badge.got{opacity:1; filter:none; border-style:solid; border-color:var(--accent); background:linear-gradient(180deg, var(--surface), var(--bg))}
.badge .bi{font-size:28px}
.badge b{font-family:var(--display); font-stretch:108%; font-size:15px}
.badge span{font-size:13px; color:var(--muted)}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,40px); opacity:0; background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:12px; font-weight:700; max-width:90%; z-index:20; pointer-events:none}
.toast.show{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion: no-preference){ .toast{transition:all .3s ease} }
#fx{position:fixed; inset:0; pointer-events:none; z-index:15}

/* PWA */
[hidden]{display:none !important}
.wrap{padding-top:max(20px, env(safe-area-inset-top)); padding-bottom:max(64px, env(safe-area-inset-bottom)); padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right))}
.tabs{grid-template-columns:repeat(5,1fr); top:env(safe-area-inset-top)}
.tabs a{font-size:13px; font-stretch:100%}
body.locked{overflow:hidden}
.adapt{border-left:4px solid var(--fell); background:var(--info-bg); border-radius:6px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; font-size:14px}
.adapt span{color:var(--muted)}
.adapt.off{border-color:var(--line)}
.link{background:none; border:0; padding:0; color:var(--accent); font-weight:700; text-align:left; text-decoration:underline; font-size:14px}
.adtag{font-size:12px; color:var(--fell); font-weight:700}
.flags{font-size:15px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chips button{border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:7px 11px; font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.painbox{display:flex; flex-direction:column; gap:8px; border:1px solid var(--line); border-radius:10px; padding:10px}
.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.sheet .sec{font-family:var(--display); font-stretch:110%; font-weight:800; font-size:15px; margin-top:4px}
.trend{display:grid; grid-template-columns:120px 1fr; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
.trend div{display:flex; flex-direction:column}
.trend span{font-size:13px; color:var(--muted)}
.spark{width:100%; height:auto}
.flagcounts{display:flex; flex-wrap:wrap; gap:6px}
.ins{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px}
.backup{display:flex; flex-direction:column; gap:10px}
.nag{border:1px solid var(--warn); background:var(--warn-bg); border-radius:12px; padding:10px 12px; display:flex; gap:10px; align-items:center; justify-content:space-between; font-size:14px}
.install{border:1px dashed var(--accent); border-radius:12px; padding:12px; font-size:14px}
.install ol{margin:6px 0 0; padding-left:18px}
.file{display:inline-flex}
.file input{position:absolute; opacity:0; width:1px; height:1px}

/* v4 */
.exlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.ex{border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px}
.ex.fin{border-color:var(--ok); background:var(--ok-bg)}
.exhead{display:flex; gap:10px; align-items:flex-start}
.exn{flex:none; width:28px; height:28px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font-family:var(--display); font-weight:800}
.exhead b{font-family:var(--display); font-stretch:108%; font-size:17px}
.dose{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
.dose span{background:var(--info-bg); border-radius:6px; padding:2px 8px; font-size:13px; font-weight:700}
.dose span:first-child{background:var(--accent); color:#fff}
.cues{margin:0; padding-left:18px; font-size:15px; display:flex; flex-direction:column; gap:2px}
.why2{font-style:italic}
.sets{display:flex; flex-wrap:wrap; gap:6px}
.set{border:2px solid var(--line); background:var(--bg); border-radius:10px; padding:10px 14px; font-weight:700}
.set[aria-pressed="true"]{background:var(--ok); border-color:var(--ok); color:#fff}
.restbar{position:fixed; left:12px; right:12px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:18; background:var(--ink); color:var(--bg); border-radius:14px; padding:10px 12px; display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-family:var(--display); font-weight:800; font-size:18px}
.restbar .track{height:8px; background:rgba(255,255,255,.25); border-radius:5px; overflow:hidden}
.restbar .fill{height:100%; background:var(--accent)}
.restbar .btn{background:transparent; color:var(--bg); border-color:rgba(255,255,255,.4)}
.chg{--k:var(--fell); border:2px solid var(--k); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; background:var(--surface)}
.k-sick{--k:var(--crit)} .k-pain{--k:var(--warn)} .k-tired{--k:var(--fell)} .k-missed{--k:var(--muted)} .k-scale{--k:var(--accent)} .k-note{--k:var(--fell)}
.chg .pill{display:inline-block; background:var(--k); color:#fff; font-family:var(--display); font-stretch:112%; font-weight:800; font-size:14px; letter-spacing:.04em; text-transform:uppercase; padding:5px 10px; border-radius:7px}
.chg-grid{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center}
.chg-grid small{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-family:var(--display); font-weight:700}
.chg-grid .was s{color:var(--muted); font-size:15px}
.chg-grid .now b{font-family:var(--display); font-stretch:110%; font-size:19px}
.chg-grid .arr{font-size:22px; color:var(--k); font-weight:800}
.chips.static span{border:1px solid var(--k); color:var(--ink); border-radius:999px; padding:3px 10px; font-size:13px; font-weight:700}
.chg .why{margin:0; font-size:14px; color:var(--muted)}
.chg .why b{color:var(--ink)}
.day.changed{border-left:4px solid var(--k); padding-left:8px}
.adtag{display:inline-block; font-size:12px; font-weight:800; color:#fff; background:var(--k, var(--fell)); border-radius:5px; padding:1px 7px}
.stv{display:inline-grid; place-items:center; width:16px; height:16px; border-radius:4px; background:#fc4c02; color:#fff; font-size:11px; font-weight:800; vertical-align:middle}
.stv.big{width:24px; height:24px; font-size:15px}
.sn{color:var(--muted)}
.suggest{border:1px solid var(--accent); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; font-size:14px}
.sugs{display:flex; flex-direction:column; gap:6px}
.sugs .btn{display:flex; flex-direction:column; align-items:flex-start; text-align:left}
.sugs .btn small{font-weight:400; font-size:12px; opacity:.85}
.tipcard .target{font-size:16px}
.scalebar{font-size:14px; color:var(--muted)}
.fold{border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.fold summary{font-weight:700; cursor:pointer}
.fold[open]{display:flex; flex-direction:column; gap:10px}
.fold[open] summary{margin-bottom:4px}
select{font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 12px; max-width:100%}
.shoes{display:flex; flex-direction:column; gap:12px}
.shoe{display:flex; flex-direction:column; gap:6px}
.shoe .lbl{display:flex; justify-content:space-between; gap:8px}
.shoe .track{height:10px; background:var(--line); border-radius:6px; overflow:hidden}
.shoe .fill{height:100%; background:var(--fell)}
.shoe .fill.warnfill{background:var(--warn)}
.shoe.retired{opacity:.5}
.gearlist{display:flex; flex-direction:column}
.gear{display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px}
.chk{font-weight:400; font-size:13px; color:var(--muted); display:flex; gap:4px; align-items:center}
.chk input{width:20px; height:20px; accent-color:var(--accent)}
details.wk{border-bottom:1px solid var(--line); padding:8px 0}
details.wk summary{font-weight:700; cursor:pointer}
details.wk[open]{display:flex; flex-direction:column; gap:8px}

/* ===== Mobiili ===== */
.mastrow{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.gearbtn{position:relative; flex:none; width:44px; height:44px; border-radius:12px; display:grid; place-items:center; color:var(--muted); border:1px solid var(--line); background:var(--surface)}
.gearbtn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.gdot{position:absolute; top:7px; right:7px; width:9px; height:9px; border-radius:50%; background:var(--crit)}
.sethead{display:flex; flex-direction:column; gap:6px}
.sethead h2{font-size:26px; font-stretch:112%}
.zchip{display:inline-block; margin-top:-4px; font-size:13px; font-weight:700; color:var(--crit); background:var(--crit-bg); border-radius:999px; padding:3px 10px; align-self:flex-start}
.zones{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
.z{display:flex; justify-content:space-between; padding:8px 12px; border-radius:8px; font-size:15px}
.z1{background:#e6eef3} .z2{background:#dcefe3} .z3{background:#f8eed2} .z4{background:#fbe1cf} .z5{background:#f7d6d3}
.z{color:#16211f}
.weather{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; font-size:14px; color:var(--muted); padding:0 4px}
.weather b{color:var(--warn)}
.warn details summary{cursor:pointer; list-style:none}
.warn details summary::-webkit-details-marker{display:none}
.warn details[open] span{display:block; margin-top:4px}
.sheet-bg{z-index:30}
body.locked .tabs{display:none}
:root{--nav-h:62px}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,a,.day,.set,label.btn{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px !important} /* estää iOS-zoomauksen */
.btn{min-height:44px}
.wrap{gap:14px; padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.tabs{position:fixed; left:0; right:0; bottom:0; top:auto; z-index:12; display:grid; grid-template-columns:repeat(5,1fr); gap:0; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); border-radius:0; border:0; border-top:1px solid var(--line); background:color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px)}
.tabs a{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0 4px; border-radius:10px; font-size:11px; font-family:var(--body); font-weight:700; color:var(--muted)}
.tabs a svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.tabs a[aria-current="page"]{background:transparent; color:var(--accent)}
.tabs a[aria-current="page"] svg{stroke-width:2.4}
@media (min-width:700px){ .tabs{max-width:620px; margin:0 auto; left:0; right:0; bottom:12px; border:1px solid var(--line); border-radius:16px; padding:6px} }
.toast{bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom))}
.restbar{bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom))}
.route{font-size:clamp(26px,8vw,44px)}
.route small{margin-top:6px}
.count{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:0 16px}
.count::-webkit-scrollbar{display:none}
.chip{white-space:nowrap; flex:none}
.install{position:relative}
.x{position:absolute; top:6px; right:6px; width:36px; height:36px; border:0; background:transparent; font-size:24px; line-height:1; color:var(--muted)}
.card{padding:14px; border-radius:16px}
.today-title h2{font-size:24px}
.day{grid-template-columns:44px 1fr 26px; padding:12px 2px; min-height:56px}
/* kirjausikkuna koko näytön levyisenä */
.sheet{max-height:94%; padding:0 16px; border-radius:20px 20px 0 0; gap:14px}
.sheet-top{position:sticky; top:0; z-index:2; background:var(--surface); padding:8px 0 6px; display:flex; flex-direction:column; gap:4px; border-bottom:1px solid var(--line)}
.grab{width:40px; height:5px; border-radius:3px; background:var(--line); align-self:center; margin-bottom:4px}
.sheet-title{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.sheet-title .x{position:static}
.sheet-foot{position:sticky; bottom:0; z-index:2; background:var(--surface); padding:10px 0 calc(12px + env(safe-area-inset-bottom)); display:flex; gap:8px; border-top:1px solid var(--line)}
.sheet-foot .btn.primary{flex:1}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.feel button{min-height:52px}
.chips button{min-height:40px}
/* historia: kortit puhelimella, taulukko leveällä */
.hcards{display:none; list-style:none; margin:0; padding:0; flex-direction:column}
.hcard{display:grid; grid-template-columns:52px 1fr; gap:10px; padding:12px 2px; border-bottom:1px solid var(--line); cursor:pointer}
.hcard .hd{font-family:var(--display); font-weight:800; font-size:15px; line-height:1.15}
.hcard .hd small{display:block; font-family:var(--body); font-weight:400; font-size:12px; color:var(--muted)}
.hcard .hm{display:flex; flex-direction:column; gap:3px; min-width:0}
.hcard .hs{font-size:14px; font-variant-numeric:tabular-nums}
.hcard .hn{font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
@media (max-width:640px){ .tablewrap{display:none} .hcards{display:flex} }
.tiles{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.tile b{font-size:20px}
.gear{grid-template-columns:1fr auto auto; gap:8px}
.chk input{width:22px; height:22px}
.levelcard{padding:16px}

/* ===== v5 UI ===== */
/* Header: big on Tänään, thin sticky bar elsewhere */
.pagetitle{display:none}
body:not([data-route="tanaan"]) .mast{position:sticky; top:0; z-index:11; margin:-20px -16px 0; padding:calc(8px + env(safe-area-inset-top)) 16px 8px; background:color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); gap:0}
body:not([data-route="tanaan"]) .route, body:not([data-route="tanaan"]) .count{display:none}
body:not([data-route="tanaan"]) .pagetitle{display:block; font-size:22px; font-stretch:112%; font-weight:800; align-self:center}
body:not([data-route="tanaan"]) .mastrow{align-items:center}
body:not([data-route="tanaan"]) .gearbtn{width:38px; height:38px}
body[data-route="asetukset"] .mast{display:none}
/* Hero */
.hero{gap:14px; border-width:2px; border-color:color-mix(in srgb, var(--accent) 35%, var(--line))}
.herotop{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
.herohead{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.hero.other{border-color:var(--line); border-style:dashed}
.hero.other .wchip{display:none}
.pill{display:inline-flex; align-items:center; gap:7px; border:0; border-radius:999px; padding:6px 12px; font-weight:700; font-size:14px; background:var(--ok-bg); color:var(--ok)}
.pill.st-warn{background:var(--warn-bg); color:var(--warn)} .pill.st-crit{background:var(--crit-bg); color:var(--crit)}
.pill .dot{width:9px; height:9px; background:currentColor}
.pill .pc{font-weight:400; opacity:.85; padding-left:6px; border-left:1px solid currentColor}
.pill:disabled{cursor:default; opacity:1}
.wchip{font-size:13px; color:var(--muted); text-align:right; max-width:60%; line-height:1.3}
.wchip b{color:var(--warn); display:block; font-weight:700}
.sess{display:flex; flex-direction:column; gap:10px}
.sess.extra{border-top:1px dashed var(--line); padding-top:12px}
.acts{display:flex; flex-direction:column; gap:10px; margin-top:2px}
.btn.big{width:100%; padding:15px 16px; font-size:17px; border-radius:12px}
.btn.wide{width:100%}
.iconacts{display:grid; grid-template-columns:repeat(auto-fit,minmax(64px,1fr)); gap:6px}
.ia{display:flex; flex-direction:column; align-items:center; gap:2px; border:1px solid var(--line); background:transparent; border-radius:10px; padding:8px 4px; font-size:12px; font-weight:700; color:var(--muted)}
.ia span{font-size:18px; line-height:1.1; color:var(--ink)}
.tipline{font-size:13px; color:var(--muted); margin:0 4px; line-height:1.4}
.status{gap:8px; padding:10px 12px}
/* Week strip */
.strip{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.sd{position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 8px; border:1px solid transparent; border-radius:10px; background:transparent; min-width:0}
.sd .dw{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
.sd .dn{font-family:var(--display); font-weight:800; font-size:17px; line-height:1}
.sd .ty{font-size:10px; font-weight:700; padding:1px 4px; border-radius:4px; max-width:100%; overflow:hidden; text-overflow:clip; white-space:nowrap}
.sd .mark{width:18px; height:18px; font-size:10px; border-width:1.5px}
.sd .mark.none{border-color:transparent}
.sd.today{background:var(--info-bg)}
.sd.today .dn{color:var(--accent)}
.sd.sel{border-color:var(--ink)}
.sd.chg::after{content:""; position:absolute; top:5px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--fell)}
.sd.empty{opacity:.35}
.sd .plus{position:absolute; bottom:2px; right:4px; font-style:normal; font-size:9px; font-weight:800; color:var(--muted)}
#weekList .days{border-top:0}
/* History by week */
.wkhead{list-style:none; display:flex; justify-content:space-between; align-items:baseline; padding:14px 2px 4px; font-family:var(--display); font-weight:800; font-size:14px; letter-spacing:.06em; text-transform:uppercase; border-bottom:2px solid var(--ink)}
.wkhead span, .wkrow span{font-family:var(--body); font-weight:400; text-transform:none; letter-spacing:0; color:var(--muted); font-size:13px; margin-left:8px}
.wkrow td{font-family:var(--display); font-weight:800; padding-top:12px; border-bottom:2px solid var(--ink)}
.hcard{padding:8px 2px; gap:8px; grid-template-columns:44px 1fr}
.hcard .hs{font-size:13px}
/* Strength accordion */
.ex{padding:0; gap:0}
.ex details summary{list-style:none; padding:12px; cursor:pointer}
.ex details summary::-webkit-details-marker{display:none}
.ex details summary::after{content:"›"; margin-left:auto; color:var(--muted); font-size:20px; transition:transform .15s}
.ex details[open] summary::after{transform:rotate(90deg)}
.exbody{padding:0 12px 12px; display:flex; flex-direction:column; gap:8px}
.exlist{gap:8px}
.exlist.active .ex:not(.cur):not(.fin){opacity:.7}
.ex.cur{border:2px solid var(--accent); box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 18%, transparent)}
.ex.fin .exn{background:var(--ok)}
.ex.cur .set{padding:14px 18px; font-size:16px}
/* Analysis segments */
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
.seg button{border:0; background:transparent; border-radius:9px; padding:9px 0; font-weight:700; color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink); color:var(--bg)}
.agroup{display:flex; flex-direction:column; gap:18px}
.agroup[hidden]{display:none}
.trend{grid-template-columns:1fr; gap:4px}
.trend div{flex-direction:row; justify-content:space-between; align-items:baseline}
/* Tiles: no clipped labels */
.tile span{font-size:11px; letter-spacing:.04em; hyphens:auto; -webkit-hyphens:auto; overflow-wrap:anywhere; line-height:1.2}
/* View fade */
@media (prefers-reduced-motion: no-preference){
  .view:not([hidden]){animation:vfade .18s ease-out}
  @keyframes vfade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
}
</style>
</head>
