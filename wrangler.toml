# Cloudflare Worker: Strava-välipalvelin (vain strava-worker/worker.js, ei sovellusta)
name = "nuts"
main = "strava-worker/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
# Säilytä Cloudflaren hallintapaneelissa asetetut muuttujat (APP_URL, STRAVA_CLIENT_ID).
keep_vars = true

# Pilvivarmuuskopio ja ilmoitukset (Cloudflare KV -tallennustila "nuts")
kv_namespaces = [
  { binding = "PALLAS_KV", id = "259e45908cd6462e8c93b56b5b6eead8" }
]

[vars]
APP_URL = "https://zokaas.github.io/nuts/"
STRAVA_CLIENT_ID = "298237"
# STRAVA_CLIENT_SECRET on asetettu Cloudflaressa salaisuutena (Secret), ei koskaan tähän tiedostoon.

# Iltatarkistus klo 20.45 Suomen aikaa (kaksi aikaa kattavat kesä- ja talviajan; koodi valitsee oikean)
[triggers]
crons = ["45 17 * * *", "45 18 * * *"]
